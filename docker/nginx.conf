server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SecDevOps (OWASP A05): ocultar versión y cabeceras de seguridad básicas.
    # (CSP completa pendiente: ver informe; una política estricta puede romper PrimeReact/Quill)
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Bloquear archivos ocultos y mapas de código fuente
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # API en el mismo origen: /api se reenvía al nginx del backend (servicio "web").
    # ^~ evita que las location por extensión (.png, .js...) capturen rutas de la API.
    location ^~ /api/ {
        client_max_body_size 3m;            # foto de perfil: hasta 2 MB + multipart
        resolver 127.0.0.11 valid=10s;      # DNS de Docker: re-resuelve si "web" se recrea
        set $backend http://web:80;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;            # reportes PDF pesados
    }

    # SPA: todas las rutas caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
